name: Java CI


on:
  push:
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: sedang checkout java
        uses: actions/checkout@v5


      - name: Sedang setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: sedang tes pake java 17 dan pake maven
        run: mvn test
